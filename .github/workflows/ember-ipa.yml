name: Build Ember.ipa

# Builds the unsigned .ipa for Ember on a GitHub Mac, so no local Mac, Xcode
# or Homebrew is needed. The .ipa is attached to the run as an artifact.
#
# No guest image, firmware or Apple key is involved here.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/gallant-brahmagupta-lxzjzh
    paths:
      - "ember/**"
      - ".github/workflows/ember-ipa.yml"

concurrency:
  group: ember-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A few seconds on a Linux runner. If this starts and the Mac job does not,
  # the trouble is with GitHub's Mac runners and not with the account.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - run: echo "A hosted runner started for this repository."

  # The same few seconds on each kind of Mac runner, to see which of them
  # actually start a job right now.
  macprobe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - run: |
          echo "Started on ${{ matrix.os }}: $(uname -m)"
          ls -d /Applications/Xcode*.app

  build:
    # macos-26 runners were assigned and then dropped the job twice; macos-15
    # carries the newer Xcode versions as well.
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ember

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        working-directory: /Applications
        run: |
          ls -d Xcode*.app
          NEWEST="$(ls -d Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "/Applications/${NEWEST:-Xcode.app}"
          xcodebuild -version

      - name: Environment fingerprint (cache key)
        id: env
        run: echo "xcode=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies (prefix)
        uses: actions/cache@v4
        with:
          path: ember/prefix
          key: ember-iosdeps-${{ runner.os }}-${{ steps.env.outputs.xcode }}-${{ hashFiles('ember/scripts/build-ios-deps.sh') }}

      - name: Build Inferno.ipa
        run: ./build-ipa-on-mac.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ember-ipa
          path: ember/app/Inferno.ipa
          if-no-files-found: error
