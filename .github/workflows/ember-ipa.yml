name: Build Ember.ipa

# Builds the unsigned .ipa for Ember on a GitHub Mac, so no local Mac, Xcode
# or Homebrew is needed. The .ipa is attached to the run as an artifact.
#
# No guest image, firmware or Apple key is involved here.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/gallant-brahmagupta-lxzjzh
    paths:
      - "ember/**"
      - ".github/workflows/ember-ipa.yml"

concurrency:
  group: ember-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bare test jobs started on a Mac within seconds and the build never has.
  # This one has the build's shape (same actions, same timeout) and nothing to
  # do, to tell whether that shape is what keeps a Mac from starting it.
  shape:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ember/prefix-shape
          key: ember-shape-${{ runner.os }}
      - run: echo "A job with the build's shape started."

  build:
    # Two kinds of Mac at once: whichever is given a runner that comes online
    # does the build. Both started a test job; macos-15 and macos-26 asked for
    # by name did not.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ember

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        working-directory: /Applications
        run: |
          ls -d Xcode*.app
          NEWEST="$(ls -d Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "/Applications/${NEWEST:-Xcode.app}"
          xcodebuild -version

      - name: Environment fingerprint (cache key)
        id: env
        run: echo "xcode=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies (prefix)
        uses: actions/cache@v4
        with:
          path: ember/prefix
          key: ember-iosdeps-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.xcode }}-${{ hashFiles('ember/scripts/build-ios-deps.sh') }}

      - name: Build Inferno.ipa
        run: ./build-ipa-on-mac.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ember-ipa-${{ matrix.os }}
          path: ember/app/Inferno.ipa
          if-no-files-found: error
