name: Build Ember.ipa

# Builds the unsigned .ipa for Ember on a GitHub Mac, so no local Mac, Xcode
# or Homebrew is needed. The .ipa is attached to the run as an artifact.
#
# No guest image, firmware or Apple key is involved here.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/gallant-brahmagupta-lxzjzh
    paths:
      - "ember/**"
      - ".github/workflows/ember-ipa.yml"

concurrency:
  group: ember-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write: to attach the .ipa to a pre-release, as well as to the run.
  contents: write

jobs:
  build:
    # The Intel Mac is the one that has built the .ipa. macos-latest was
    # queued in six runs and never given a runner.
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ember

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        working-directory: /Applications
        run: |
          ls -d Xcode*.app
          NEWEST="$(ls -d Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "/Applications/${NEWEST:-Xcode.app}"
          xcodebuild -version

      - name: Environment fingerprint (cache key)
        id: env
        run: echo "xcode=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies (prefix)
        uses: actions/cache@v4
        with:
          path: ember/prefix
          key: ember-iosdeps-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.xcode }}-${{ hashFiles('ember/scripts/build-ios-deps.sh') }}

      - name: Build Inferno.ipa
        run: ./build-ipa-on-mac.sh

      # The artifact service failed five times in a row on the first good
      # build. A pre-release is a second, separate way to the same file, and
      # one that downloads without signing in.
      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Ember-ipa
          path: ember/app/Inferno.ipa
          if-no-files-found: error

      - name: Attach to the ember-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/Inferno.ipa Ember.ipa
          gh release delete ember-build --yes --cleanup-tag || true
          gh release create ember-build Ember.ipa \
            --target "$GITHUB_SHA" --prerelease \
            --title "Ember test build" \
            --notes "Unsigned test build of Ember from commit $GITHUB_SHA. Install with a sideloading tool. Needs a guest image you build yourself and JIT from StikDebug; no Apple firmware is included."
